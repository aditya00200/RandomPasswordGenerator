<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="shortcut icon" href="https://i.etsystatic.com/36262552/r/il/0b04a5/4248120438/il_570xN.4248120438_mgc6.jpg" type="image/x-icon">
    <style>
        body{
            background:linear-gradient(to right,pink,rgb(85, 85, 255));
        }
        #heading{
            display:flex;
            justify-content:center;
            font-size:5rem;
            color:white;
            font-family:monospace;
        }
        .input{
            margin-top:14vh;
            display:flex;
            justify-content:center;
            gap:1vw;
        }
        span{
            font-size:2rem;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        #input{
            border:none;
            border-radius:20px;
            padding-left:10px;
            min-width:11vw;
        }
        .container{
            display:flex;
            justify-content:center;
        }
        #show_password{
            display:inline-block;
            justify-content:center;
            padding:20px 5px 0 5px;
            margin-top:3vh;
            background-color:rgba(0, 0, 0, 0.5);
            height:10vh;
            font-size:2rem;
            text-align:center;
            color:white;
            min-width:25vw;
            width:auto;
            border-radius:20px;
            
        }
        #copy_icon{
            margin-left:5px;
            margin-top:25px;
            height:30px;
            transition-property:transform;
            transition-duration:150ms;
        }
        #copy_icon:hover{
            transform:scale(1.15);
        }
        #generate_button{

            margin-top:4vh;
            padding:10px;
            border:none;
            border-radius:20px;
            font-size:1rem;
            transition-property:transform;
            transition-duration:150ms;
        }
        #generate_button:hover{
            transform:scale(1.1);
        }
        #btn{
            display:flex;
            justify-content:center;
        }
        img{
            height:50px;
            margin-top:25px;
            margin-left:5px;
            border-radius:100%;
        }

        @media only screen and (max-width:400px){
            #heading{
                margin-top:20px;
                margin-left:15vw;
                font-size:3rem;
            }
            span{
                font-size:1.5rem;
                font-family:'Courier New', Courier, monospace;
            }
            #show_password{
                min-width:50vw;
                max-height:30px;
                padding-top:5px;
                padding-bottom:15px;
                font-size:1.8rem;
            }
            #input{
            border-radius:20px;
            padding-left:10px;
            width:20vh;
        }

        }
    </style>
</head>
<body>
    <div id="heading">
        Password Generator
    </div>
    <div class="input">
        <span>Length:</span>
         <input id="input" type="number" placeholder="Enter the length(4-16)" min="4" max="16">
    </div>

    <div class="container">
    <div id="show_password">
    </div>
    <div id="copy_icon">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z"/></svg>
    </div>
    </div>

    <div id="btn">
        <button id="generate_button">Generate
        </button>
    </div>
    <script src="tutorial_6.js"></script>
</body>
</html>
